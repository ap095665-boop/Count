<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delivery Counter</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#050505;
color:white;
min-height:100vh;
}

.app{
max-width:520px;
margin:auto;
padding:20px 16px 120px;
}

.header{
text-align:center;
margin-bottom:25px;
}

.header h1{
font-size:32px;
font-weight:900;
}

.header p{
color:#888;
margin-top:8px;
}

.counter-wrap{
display:flex;
justify-content:center;
margin:20px 0 30px;
}

.counter{
width:270px;
height:270px;
border-radius:50%;
background:#121212;
border:7px solid #2a2a2a;
display:flex;
align-items:center;
justify-content:center;
font-size:90px;
font-weight:900;
user-select:none;
cursor:pointer;
-webkit-tap-highlight-color:transparent;
touch-action:manipulation;
box-shadow:0 0 35px rgba(255,255,255,0.08);
position:relative;
}

.counter:active{
transform:scale(0.97);
}

.counter::after{
content:'TAP';
position:absolute;
bottom:24px;
font-size:16px;
color:#666;
letter-spacing:4px;
}

.controls{
display:flex;
gap:12px;
margin-bottom:28px;
}

.controls button,
.bottom-bar button{
flex:1;
border:none;
border-radius:18px;
padding:18px;
font-size:18px;
font-weight:800;
cursor:pointer;
}

.minus-btn{
background:#ff3b30;
color:white;
}

.save-btn{
background:#00c853;
color:white;
}

.orders{
display:flex;
flex-direction:column;
gap:16px;
}

.order-card{
background:#101010;
border:1px solid #232323;
border-radius:24px;
padding:16px;
display:flex;
justify-content:space-between;
align-items:center;
}

.order-left{
display:flex;
align-items:center;
gap:14px;
}

.image-area{
width:72px;
height:72px;
border-radius:50%;
overflow:hidden;
background:#1b1b1b;
border:2px solid #333;
flex-shrink:0;
}

.image-area img{
width:100%;
height:100%;
object-fit:cover;
cursor:pointer;
}

.add-image{
width:100%;
height:100%;
border:none;
background:#2962ff;
color:white;
font-size:11px;
font-weight:800;
cursor:pointer;
padding:6px;
}

.order-info h2{
font-size:20px;
margin-bottom:4px;
}

.order-info p{
color:#888;
font-size:14px;
}

.count-circle{
width:84px;
height:84px;
border-radius:50%;
background:white;
color:black;
display:flex;
align-items:center;
justify-content:center;
font-size:38px;
font-weight:900;
}

.bottom-bar{
position:fixed;
bottom:0;
left:0;
width:100%;
padding:14px;
background:#0d0d0d;
display:flex;
gap:12px;
border-top:1px solid #222;
}

.reset-btn{
background:#ffcc00;
color:black;
}

.refresh-btn{
background:#ff1744;
color:white;
}

.empty{
text-align:center;
color:#666;
padding:40px 0;
}

.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,0.95);
display:flex;
align-items:center;
justify-content:center;
z-index:9999;
padding:20px;
}

.modal img{
max-width:100%;
max-height:90vh;
border-radius:20px;
}

.hidden-input{
display:none;
}
</style>
</head>
<body>

<div class="app">

<div class="header">
<h1>DELIVERY COUNTER</h1>
<p>IndexedDB Photo Storage</p>
</div>

<div class="counter-wrap">
<div class="counter" id="counter">0</div>
</div>

<div class="controls">
<button class="minus-btn" id="minusBtn">− Remove</button>
<button class="save-btn" id="saveBtn">Save Order</button>
</div>

<div class="orders" id="orders"></div>

</div>

<div class="bottom-bar">
<button class="reset-btn" id="resetBtn">Reset</button>
<button class="refresh-btn" id="refreshBtn">Refresh</button>
</div>

<script>
const DB_NAME='DeliveryCounterDB';
const STORE_NAME='orders';
const EXPIRY=30*60*1000;

let db;
let count=0;

const counter=document.getElementById('counter');
const minusBtn=document.getElementById('minusBtn');
const saveBtn=document.getElementById('saveBtn');
const resetBtn=document.getElementById('resetBtn');
const refreshBtn=document.getElementById('refreshBtn');
const ordersContainer=document.getElementById('orders');

function vibrate(ms){
if(navigator.vibrate){
navigator.vibrate(ms);
}
}

function openDB(){
const request=indexedDB.open(DB_NAME,1);

request.onupgradeneeded=function(event){
db=event.target.result;

if(!db.objectStoreNames.contains(STORE_NAME)){
db.createObjectStore(STORE_NAME,{keyPath:'id'});
}
};

request.onsuccess=function(event){
db=event.target.result;
loadOrders();
cleanupExpired();
};
}

function updateCounter(){
counter.innerText=count;
}

function increaseCounter(){
count++;
updateCounter();
vibrate(20);
}

counter.onclick=function(){
increaseCounter();
};

counter.ontouchend=function(e){
e.preventDefault();
increaseCounter();
};

minusBtn.onclick=function(){
if(count>0){
count--;
updateCounter();
}
};

saveBtn.onclick=function(){
if(count<=0)return;

const order={
id:Date.now(),
count:count,
image:'',
timestamp:Date.now()
};

saveOrder(order);
count=0;
updateCounter();
vibrate([80,40,80]);
};

resetBtn.onclick=function(){
count=0;
updateCounter();
};

refreshBtn.onclick=function(){
const ok=confirm('Delete all orders?');

if(ok){
const tx=db.transaction(STORE_NAME,'readwrite');
const store=tx.objectStore(STORE_NAME);
store.clear();

ordersContainer.innerHTML='';
count=0;
updateCounter();
renderEmpty();
}
};

function saveOrder(order){
const tx=db.transaction(STORE_NAME,'readwrite');
const store=tx.objectStore(STORE_NAME);

store.put(order);

loadOrders();
}

function loadOrders(){
const tx=db.transaction(STORE_NAME,'readonly');
const store=tx.objectStore(STORE_NAME);
const request=store.getAll();

request.onsuccess=function(){
let orders=request.result;

orders=orders.sort((a,b)=>a.id-b.id).slice(-5);

renderOrders(orders);
};
}

function renderEmpty(){
ordersContainer.innerHTML=`
<div class="empty">No saved orders</div>
`;
}

function renderOrders(orders){
ordersContainer.innerHTML='';

if(orders.length===0){
renderEmpty();
return;
}

orders.forEach((order,index)=>{
const card=document.createElement('div');
card.className='order-card';

card.innerHTML=`
<div class="order-left">

<div class="image-area">
${order.image
? `<img src="${order.image}" class="preview-img">`
: `
<button class="add-image">ADD IMAGE</button>
<input type="file" class="hidden-input" accept="image/*" capture="environment">
`
}
</div>

<div class="order-info">
<h2>Order ${index+1}</h2>
<p>Auto deletes in 30 mins</p>
</div>

</div>

<div class="count-circle">${order.count}</div>
`;

ordersContainer.appendChild(card);

const preview=card.querySelector('.preview-img');

if(preview){
preview.onclick=function(){
showImage(order.image);
};
}

const addBtn=card.querySelector('.add-image');
const input=card.querySelector('.hidden-input');

if(addBtn && input){
addBtn.onclick=function(){
input.click();
};

input.onchange=function(e){
const file=e.target.files[0];

if(!file)return;

compressImage(file,function(result){
order.image=result;
saveOrder(order);
});
};
}
});
}

function compressImage(file,callback){
const reader=new FileReader();

reader.onload=function(event){
const img=new Image();

img.onload=function(){
const canvas=document.createElement('canvas');
const ctx=canvas.getContext('2d');

const maxWidth=500;
const scale=maxWidth/img.width;

canvas.width=maxWidth;
canvas.height=img.height*scale;

ctx.drawImage(img,0,0,canvas.width,canvas.height);

const compressed=canvas.toDataURL('image/jpeg',0.7);
callback(compressed);
};

img.src=event.target.result;
};

reader.readAsDataURL(file);
}

function showImage(src){
const modal=document.createElement('div');
modal.className='modal';

modal.innerHTML=`<img src="${src}">`;

modal.onclick=function(){
modal.remove();
};

document.body.appendChild(modal);
}

function cleanupExpired(){
setInterval(()=>{
const tx=db.transaction(STORE_NAME,'readwrite');
const store=tx.objectStore(STORE_NAME);
const request=store.getAll();

request.onsuccess=function(){
const now=Date.now();

request.result.forEach(order=>{
if(now-order.timestamp>EXPIRY){
store.delete(order.id);
}
});

loadOrders();
};
},60000);
}

openDB();
updateCounter();
</script>

</body>
</html>
